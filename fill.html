<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điền chỗ trống HSK - HanziLinh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="stylesheet" href="css/vocab.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/fill.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" aria-label="HanziLinh, trang chủ">
    <span class="seal" aria-hidden="true">学</span>
    <span class="brand-name">HanziLinh</span>
  </a>
  <nav aria-label="Menu chính">
    <a href="index.html#cap-do">Cấp độ HSK</a>
    <a href="index.html#cong-cu">Công cụ học</a>
  </nav>
</header>

<main class="narrow">
  <h1 id="title">Điền chỗ trống HSK</h1>
  <div class="chips std" id="levelChips" role="group" aria-label="Cấp độ HSK"></div>
  <div class="chips std" id="stdChips" role="group" aria-label="Chuẩn HSK"></div>
  <p class="lead" id="info">Đang tải dữ liệu...</p>

  <section id="setup" class="panel hide">
    <p class="lbl">Số câu hỏi</p>
    <div class="chips" id="countChips" role="group" aria-label="Số câu hỏi">
      <button class="chip" type="button" data-v="10" aria-pressed="true">10 câu</button>
      <button class="chip" type="button" data-v="20" aria-pressed="false">20 câu</button>
      <button class="chip" type="button" data-v="30" aria-pressed="false">30 câu</button>
    </div>
    <p class="lbl">Thời gian</p>
    <div class="chips" id="timeChips" role="group" aria-label="Thời gian làm bài">
      <button class="chip" type="button" data-v="off" aria-pressed="true">Không giới hạn</button>
      <button class="chip" type="button" data-v="on" aria-pressed="false">Đếm ngược</button>
    </div>
    <p class="timenote" id="timeNote"></p>
    <label class="check"><input type="checkbox" id="prefNew"> Ưu tiên từ tôi chưa thuộc (theo thẻ từ vựng)</label>
    <p class="best" id="best"></p>
    <button class="btn2 p full" id="start" type="button">Bắt đầu làm bài</button>
  </section>

  <section id="play" class="hide">
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <p class="meta"><span id="qcount"></span><span id="qtimer" class="qtimer hide" role="timer" aria-label="Thời gian còn lại"></span><span id="qscore"></span></p>
    <div class="panel">
      <p class="qtype" id="qtype">Chọn từ điền vào chỗ trống</p>
      <p class="sent" id="sent"></p>
      <p class="hint" id="hint"></p>
      <div class="opts" id="opts"></div>
      <div id="fb" class="fb hide" aria-live="polite"></div>
      <button class="btn2 p full hide" id="next" type="button"></button>
    </div>
  </section>

  <section id="result" class="panel hide">
    <p class="score" id="sc"></p>
    <p class="msg" id="ms"></p>
    <p class="msg" id="tm"></p>
    <div id="rv"></div>
    <div class="row">
      <button class="btn2 p" id="again" type="button">Làm đề mới</button>
      <a class="btn2 linkbtn" href="vocab.html?level=1&std=3" id="toCards">Ôn lại thẻ từ vựng</a>
    </div>
  </section>
</main>

<footer class="foot">
  <p>HanziLinh, trang ôn tập tiếng Trung do Helen xây dựng.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js?v=2"></script>
<script src="js/track.js?v=1"></script>
<script src="js/fill.js"></script>
</body>
</html>
