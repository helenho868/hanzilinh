<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bài tập tiếng Anh - HanziLinh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=15">
<link rel="stylesheet" href="css/baitap.css?v=1">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" aria-label="HanziLinh, trang chủ">
    <span class="seal" aria-hidden="true">学</span>
    <span class="brand-name">HanziLinh</span>
  </a>
  <nav aria-label="Menu chính">
    <a href="index.html#vui-hoc">Vui học</a>
  </nav>
</header>
<main class="narrow">
  <h1>Bài tập tiếng Anh</h1>

  <section id="lock" class="lockbox" aria-busy="false">
    <p class="lead">Trang này được khóa. Nhập key do giáo viên cung cấp để mở bài tập.</p>
    <form id="lockForm" autocomplete="off">
      <label for="key">Key mở khóa</label>
      <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128" required>
      <button class="btn" type="submit" id="unlockBtn">Mở khóa</button>
      <p class="err" id="lockErr" role="alert" aria-live="assertive"></p>
    </form>
  </section>

  <section id="list" class="hide">
    <p class="lead">Chọn một bài để làm. Nộp bài xong sẽ có điểm và lời giải thích cho các câu sai.</p>
    <p class="err" id="listErr" role="status" aria-live="polite"></p>
    <ul class="mods" id="mods"></ul>
    <button class="btn2" id="relock" type="button">Khóa lại</button>
  </section>

  <section id="run" class="hide"></section>
</main>
<footer class="foot"><p>HanziLinh, trang ôn tập do Helen xây dựng.</p></footer>
<script src="js/baitap.js?v=2"></script>
<script src="js/track.js?v=1"></script>
</body>
</html>
