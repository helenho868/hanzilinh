<main class="narrow">
  <h1>Thành ngữ tiếng Trung</h1>
  <p class="lead">Thành ngữ 四字 (bốn chữ) thường gặp, có phiên âm, âm Hán Việt, nghĩa và ví dụ. Một số thành ngữ có kèm câu chuyện ngụ ngôn.</p>
  <div class="tabs" role="group" aria-label="Chế độ">
    <button class="chip" id="tLearn" type="button" aria-pressed="true">Học</button>
    <button class="chip" id="tQuiz" type="button" aria-pressed="false">Làm bài trắc nghiệm</button>

    <div class="chips" id="topics" role="group" aria-label="Lọc theo chủ đề"></div>

    <p class="count" id="count"></p>
    <ul class="cy" id="list"></ul>
  </section>
  <section id="quiz" class="hide" aria-live="polite"></section>
  <p class="note" id="note"></p>
</main>
<footer class="foot"><p>HanziLinh, trang ôn tập tiếng Trung do Helen xây dựng.</p></footer>
